<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wie Zit Waar?</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            -webkit-touch-callout: none; }

        :root {
            --bg: #f0e6d3;
            --accent: #e74c3c;
            --accent2: #3498db;
            --accent3: #2ecc71;
            --accent4: #f39c12;
            --text: #2c3e50;
            --text-light: #ecf0f1;
            --dark: #2c3e50;
            --shadow: 0 2px 12px rgba(0,0,0,0.12);
            --radius: 16px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            background: var(--dark);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 50;
        }

        .topbar h1 { font-size: 1.1em; }

        .score-pills {
            display: flex;
            gap: 8px;
        }

        .pill {
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pill.good { background: rgba(46,204,113,0.3); }
        .pill.warn { background: rgba(243,156,18,0.3); }
        .pill.bad { background: rgba(231,76,60,0.3); }

        /* ===== MAIN CONTENT ===== */
        .main {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .view {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            padding-bottom: 90px;
            display: none;
            -webkit-overflow-scrolling: touch;
        }

        .view.active { display: block; }

        /* ===== BOTTOM NAV ===== */
        .bottomnav {
            background: white;
            display: flex;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.1);
            flex-shrink: 0;
            padding-bottom: var(--safe-bottom);
            z-index: 50;
        }

        .nav-item {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            border: none;
            background: none;
            cursor: pointer;
            color: #999;
            font-size: 0.7em;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-item .nav-icon { font-size: 1.8em; display: block; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent2); }

        /* ===== CARDS ===== */
        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            overflow: hidden;
            transition: transform 0.15s;
        }

        .card:active { transform: scale(0.98); }

        .card-color-bar {
            height: 6px;
        }

        .card-body {
            padding: 14px 16px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-title {
            font-weight: 700;
            font-size: 1em;
            flex: 1;
        }

        .card-sub {
            font-size: 0.8em;
            color: #888;
            margin-top: 2px;
        }

        /* ===== POPPETJE ===== */
        .poppetje {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .poppetje-small {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        /* ===== FTE BAR ===== */
        .fte-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .fte-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .fte-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #999;
            margin-top: 4px;
        }

        /* ===== BADGES ===== */
        .badge {
            display: inline-block;
            font-size: 0.7em;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 600;
        }

        .badge-high { background: #fde8e8; color: var(--accent); }
        .badge-medium { background: #fef3cd; color: #856404; }
        .badge-low { background: #d4edda; color: #155724; }
        .badge-role { background: #eef2f7; color: #555; }
        .badge-filled { background: #d4edda; color: #155724; }
        .badge-unfilled { background: #fde8e8; color: #721c24; }

        .badges-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        /* ===== DEPT EMPLOYEES LIST ===== */
        .dept-people {
            margin-top: 10px;
            border-top: 1px solid #f0f0f0;
            padding-top: 10px;
        }

        .dept-person-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f8f8f8;
        }

        .dept-person-row:last-child { border-bottom: none; }

        .dept-person-name { flex: 1; font-size: 0.9em; font-weight: 500; }

        .dept-person-fte {
            font-size: 0.85em;
            font-weight: 700;
            color: var(--accent2);
            min-width: 50px;
            text-align: right;
        }

        .dept-person-remove {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background: #fee;
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius);
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            width: 100%;
            text-align: center;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary { background: var(--accent2); color: white; }
        .btn-success { background: var(--accent3); color: white; }
        .btn-danger { background: var(--accent); color: white; }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 2px solid #ddd;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85em;
            width: auto;
            border-radius: 12px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-row .btn { flex: 1; }

        .fab {
            position: fixed;
            bottom: calc(70px + var(--safe-bottom));
            right: 16px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--accent2);
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 20px rgba(52,152,219,0.4);
            cursor: pointer;
            z-index: 40;
            transition: transform 0.2s;
        }

        .fab:active { transform: scale(0.9); }

        /* ===== BOTTOM SHEET ===== */
        .sheet-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            backdrop-filter: blur(2px);
        }

        .sheet-overlay.show { display: block; }

        .sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: white;
            border-radius: 20px 20px 0 0;
            z-index: 210;
            max-height: 90dvh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            padding-bottom: var(--safe-bottom);
        }

        .sheet.show { transform: translateY(0); }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin: 10px auto 6px;
        }

        .sheet-content {
            padding: 10px 20px 30px;
        }

        .sheet-content h2 {
            font-size: 1.2em;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8em;
            font-weight: 600;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1em;
            background: #fafafa;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        .form-group input, .form-group select,
        .form-group textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent2);
            background: white;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group { flex: 1; }

        .color-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .color-dot.selected { border-color: var(--text); transform: scale(1.15); }
        .color-dot:active { transform: scale(0.9); }

        /* ===== FTE STEPPER ===== */
        .fte-stepper {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin: 12px 0;
        }

        .fte-stepper-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #ddd;
            background: white;
            font-size: 1.4em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            transition: all 0.15s;
        }

        .fte-stepper-btn:active { background: #f0f0f0; transform: scale(0.9); }

        .fte-stepper-value {
            font-size: 2em;
            font-weight: 700;
            min-width: 80px;
            text-align: center;
        }

        /* ===== CANVAS VIEW ===== */
        .canvas-scroll {
            min-height: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            align-content: start;
        }

        @media (min-width: 600px) {
            .canvas-scroll { grid-template-columns: 1fr 1fr; }
        }

        @media (min-width: 900px) {
            .canvas-scroll { grid-template-columns: 1fr 1fr 1fr; }
        }

        .canvas-dept {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .canvas-dept.dragging {
            opacity: 0.85;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            z-index: 100;
            transform: scale(1.03);
        }

        .canvas-dept.drop-placeholder {
            opacity: 0.3;
        }

        .canvas-dept-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            color: #ccc;
            font-size: 1.2em;
            cursor: grab;
            flex-shrink: 0;
            touch-action: none;
        }

        .drag-handle:active { cursor: grabbing; }

        .canvas-dept-title {
            font-weight: 700;
            font-size: 1.05em;
        }

        .canvas-dept-body {
            padding: 0 16px 14px;
        }

        .canvas-poppetjes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .canvas-poppetje {
            position: relative;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .canvas-poppetje:active { transform: scale(1.2); }

        .canvas-poppetje .p-fte {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 1px 5px;
            border-radius: 6px;
            white-space: nowrap;
            font-weight: 600;
        }

        .add-person-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: 2px dashed #ccc;
            border-radius: 50%;
            background: #f8f8f8;
            cursor: pointer;
            font-size: 1.3em;
            color: #aaa;
            transition: all 0.15s;
        }

        .add-person-btn:active { background: #eee; transform: scale(0.9); }

        /* ===== CONNECTION LINES (simplified for mobile) ===== */
        .connection-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 8px;
            background: #f0f4ff;
            color: var(--accent2);
            margin-top: 4px;
        }

        /* ===== PICK LIST ===== */
        .pick-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid #f0f0f0;
            margin-bottom: 8px;
        }

        .pick-item:active { background: #f0f4ff; }
        .pick-item.disabled { opacity: 0.4; pointer-events: none; }

        .pick-item-info { flex: 1; }
        .pick-item-name { font-weight: 600; font-size: 0.95em; }
        .pick-item-meta { font-size: 0.8em; color: #999; }

        /* ===== EMPTY STATE ===== */
        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }

        .empty-icon { font-size: 3em; margin-bottom: 12px; }
        .empty p { font-size: 0.95em; line-height: 1.5; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            padding: 10px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
            z-index: 300;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            transition: transform 0.3s ease;
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--accent3); }
        .toast.warning { background: var(--accent4); }
        .toast.error { background: var(--accent); }

        /* ===== SETTINGS VIEW ===== */
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .setting-label { font-weight: 500; }
        .setting-desc { font-size: 0.8em; color: #999; margin-top: 2px; }
    </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <h1>Wie Zit Waar?</h1>
    <div class="score-pills">
        <div class="pill" id="pill-score">&#x2B50; <span id="score-val">0</span></div>
        <div class="pill" id="pill-fill">&#x1F4CA; <span id="fill-val">0%</span></div>
        <div class="pill" id="pill-gaps">&#x26A0;&#xFE0F; <span id="gaps-val">0</span></div>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

    <!-- === OVERZICHT (Canvas) View === -->
    <div class="view active" id="view-canvas">
        <div class="canvas-scroll" id="canvas-content"></div>
    </div>

    <!-- === MEDEWERKERS View === -->
    <div class="view" id="view-employees">
        <div id="employees-list"></div>
    </div>

    <!-- === AFDELINGEN View === -->
    <div class="view" id="view-departments">
        <div id="departments-list"></div>
    </div>

    <!-- === INSTELLINGEN View === -->
    <div class="view" id="view-settings">
        <h2 style="margin-bottom:16px;">Instellingen</h2>
        <div class="card"><div class="card-body">
            <div class="setting-row">
                <div>
                    <div class="setting-label">Data exporteren</div>
                    <div class="setting-desc">Download als JSON bestand</div>
                </div>
                <button class="btn btn-sm btn-outline" onclick="exportData()">Exporteer</button>
            </div>
            <div class="setting-row">
                <div>
                    <div class="setting-label">Data importeren</div>
                    <div class="setting-desc">Laad een eerder geëxporteerd bestand</div>
                </div>
                <button class="btn btn-sm btn-outline" onclick="importData()">Importeer</button>
            </div>
            <div class="setting-row" style="border:none;">
                <div>
                    <div class="setting-label" style="color:var(--accent);">Alles wissen</div>
                    <div class="setting-desc">Verwijder alle data en begin opnieuw</div>
                </div>
                <button class="btn btn-sm btn-danger" onclick="resetAll()">Wissen</button>
            </div>
        </div></div>
        <div class="card"><div class="card-body">
            <div class="setting-row" style="border:none;">
                <div>
                    <div class="setting-label">Demo data laden</div>
                    <div class="setting-desc">Vul met voorbeelddata om te testen</div>
                </div>
                <button class="btn btn-sm btn-primary" onclick="loadDemo()">Laden</button>
            </div>
        </div></div>
    </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="fabAction()">+</button>

<!-- BOTTOM NAV -->
<div class="bottomnav">
    <button class="nav-item active" data-view="canvas" onclick="switchView('canvas')">
        <span class="nav-icon">&#x1F3AF;</span>Overzicht
    </button>
    <button class="nav-item" data-view="employees" onclick="switchView('employees')">
        <span class="nav-icon">&#x1F464;</span>Mensen
    </button>
    <button class="nav-item" data-view="departments" onclick="switchView('departments')">
        <span class="nav-icon">&#x1F3E0;</span>Afdelingen
    </button>
    <button class="nav-item" data-view="settings" onclick="switchView('settings')">
        <span class="nav-icon">&#x2699;&#xFE0F;</span>Meer
    </button>
</div>

<!-- SHEET OVERLAY -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>

<!-- BOTTOM SHEET -->
<div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-content" id="sheet-content"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- IMPORT -->
<input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
// ===== STATE =====
let state = {
    employees: [],
    departments: [],
    allocations: [],    // { empId, deptId, fte }
    deptOrder: [],      // ordered dept ids for canvas
    nextEmpId: 1,
    nextDeptId: 1
};

let currentView = 'canvas';

// ===== POPPETJE SVG =====
function poppetjeSVG(color, size = 44) {
    const s = size;
    const cx = s / 2;
    const hr = s * 0.22;
    const dk = darken(color, 35);
    return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg">
        <circle cx="${cx}" cy="${s*0.22}" r="${hr}" fill="${color}" stroke="${dk}" stroke-width="1.5"/>
        <ellipse cx="${cx}" cy="${s*0.55}" rx="${s*0.22}" ry="${s*0.2}" fill="${color}" stroke="${dk}" stroke-width="1.5"/>
        <line x1="${cx-s*0.08}" y1="${s*0.72}" x2="${cx-s*0.13}" y2="${s*0.92}" stroke="${dk}" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="${cx+s*0.08}" y1="${s*0.72}" x2="${cx+s*0.13}" y2="${s*0.92}" stroke="${dk}" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="${cx-s*0.2}" y1="${s*0.5}" x2="${cx-s*0.3}" y2="${s*0.65}" stroke="${dk}" stroke-width="2" stroke-linecap="round"/>
        <line x1="${cx+s*0.2}" y1="${s*0.5}" x2="${cx+s*0.3}" y2="${s*0.65}" stroke="${dk}" stroke-width="2" stroke-linecap="round"/>
        <circle cx="${cx-hr*0.3}" cy="${s*0.19}" r="${hr*0.09}" fill="#333"/>
        <circle cx="${cx+hr*0.3}" cy="${s*0.19}" r="${hr*0.09}" fill="#333"/>
        <path d="M${cx-hr*0.25} ${s*0.27} Q${cx} ${s*0.34} ${cx+hr*0.25} ${s*0.27}" stroke="#333" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="${cx-s*0.14}" cy="${s*0.94}" rx="${s*0.05}" ry="${s*0.03}" fill="${dk}"/>
        <ellipse cx="${cx+s*0.14}" cy="${s*0.94}" rx="${s*0.05}" ry="${s*0.03}" fill="${dk}"/>
    </svg>`;
}

function darken(hex, amt) {
    hex = hex.replace('#','');
    const r = Math.max(0, parseInt(hex.substr(0,2),16) - amt);
    const g = Math.max(0, parseInt(hex.substr(2,2),16) - amt);
    const b = Math.max(0, parseInt(hex.substr(4,2),16) - amt);
    return `rgb(${r},${g},${b})`;
}

// ===== NAVIGATION =====
function switchView(view) {
    currentView = view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(`view-${view}`).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.toggle('active', n.dataset.view === view);
    });
    const fab = document.getElementById('fab');
    fab.style.display = (view === 'settings') ? 'none' : 'flex';
    renderView();
}

function fabAction() {
    if (currentView === 'canvas') {
        // Show pick: add dept to canvas or go to depts
        openAddDeptToCanvas();
    } else if (currentView === 'employees') {
        openEmployeeSheet();

// ===== CANVAS DRAG REORDER =====
let dragEl = null;
let dragStartY = 0;
let dragStartX = 0;
let dragOffsetY = 0;
let dragOffsetX = 0;
let dragClone = null;
let dragPlaceholder = null;

function initCanvasDrag() {
    const container = document.getElementById('canvas-content');
    const handles = container.querySelectorAll('[data-drag="true"]');

    handles.forEach(handle => {
        handle.addEventListener('touchstart', onDragStart, { passive: false });
        handle.addEventListener('mousedown', onDragStart);
    });
}

function onDragStart(e) {
    e.preventDefault();
    const card = e.target.closest('.canvas-dept');
    if (!card) return;

    dragEl = card;
    const rect = card.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;

    dragStartY = touch.clientY;
    dragStartX = touch.clientX;
    dragOffsetY = touch.clientY - rect.top;
    dragOffsetX = touch.clientX - rect.left;

    // Create floating clone
    dragClone = card.cloneNode(true);
    dragClone.style.position = 'fixed';
    dragClone.style.left = rect.left + 'px';
    dragClone.style.top = rect.top + 'px';
    dragClone.style.width = rect.width + 'px';
    dragClone.style.zIndex = '999';
    dragClone.style.pointerEvents = 'none';
    dragClone.classList.add('dragging');
    document.body.appendChild(dragClone);

    // Make original a placeholder
    card.classList.add('drop-placeholder');

    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
}

function onDragMove(e) {
    if (!dragEl || !dragClone) return;
    e.preventDefault();

    const touch = e.touches ? e.touches[0] : e;
    dragClone.style.left = (touch.clientX - dragOffsetX) + 'px';
    dragClone.style.top = (touch.clientY - dragOffsetY) + 'px';

    // Find card under finger
    const container = document.getElementById('canvas-content');
    const cards = [...container.querySelectorAll('.canvas-dept:not(.drop-placeholder)')];

    for (const card of cards) {
        const rect = card.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        const midX = rect.left + rect.width / 2;

        // Check if touch is within this card's bounds
        if (touch.clientY > rect.top && touch.clientY < rect.bottom &&
            touch.clientX > rect.left && touch.clientX < rect.right) {

            const isVertical = container.offsetWidth < 600;
            if (isVertical) {
                if (touch.clientY < midY) {
                    container.insertBefore(dragEl, card);
                } else {
                    container.insertBefore(dragEl, card.nextSibling);
                }
            } else {
                // Grid: compare position
                const dragRect = dragEl.getBoundingClientRect();
                if (touch.clientY < midY || (touch.clientY < rect.bottom && touch.clientX < midX)) {
                    container.insertBefore(dragEl, card);
                } else {
                    container.insertBefore(dragEl, card.nextSibling);
                }
            }
            break;
        }
    }
}

function onDragEnd(e) {
    if (dragClone) {
        dragClone.remove();
        dragClone = null;
    }
    if (dragEl) {
        dragEl.classList.remove('drop-placeholder');
        // Save new order
        const container = document.getElementById('canvas-content');
        const newOrder = [...container.querySelectorAll('.canvas-dept')].map(el => parseInt(el.dataset.deptId));
        state.deptOrder = newOrder;
        saveState();
        dragEl = null;
    }

    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('touchend', onDragEnd);
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
}

// ===== SCORES =====
function updateScores() {
    const mult = { high: 3, medium: 2, low: 1 };
    let score = 0, totalNeeded = 0, totalFilled = 0, gaps = 0;

    state.departments.forEach(dept => {
        const filled = getDeptFilled(dept.id);
        totalNeeded += dept.fteNeeded;
        totalFilled += Math.min(filled, dept.fteNeeded);

        const fillPct = dept.fteNeeded > 0 ? filled / dept.fteNeeded : 1;
        const m = mult[dept.priority] || 1;
        score += Math.round(fillPct * 100 * m);

        if (filled < dept.minFte) {
            score -= Math.round(((dept.minFte - filled) / dept.minFte) * 50 * m);
            gaps++;
        }
        if (filled > dept.maxFte) score -= Math.round((filled - dept.maxFte) * 10);
        if (filled < dept.fteNeeded) gaps++;
    });

    score = Math.max(0, score);
    const fillRate = totalNeeded > 0 ? Math.round((totalFilled / totalNeeded) * 100) : 0;

    document.getElementById('score-val').textContent = score;
    document.getElementById('fill-val').textContent = fillRate + '%';
    document.getElementById('gaps-val').textContent = gaps;

    const ps = document.getElementById('pill-score');
    ps.className = `pill ${score > 300 ? 'good' : score > 100 ? 'warn' : 'bad'}`;
    const pf = document.getElementById('pill-fill');
    pf.className = `pill ${fillRate >= 80 ? 'good' : fillRate >= 50 ? 'warn' : 'bad'}`;
    const pg = document.getElementById('pill-gaps');
    pg.className = `pill ${gaps === 0 ? 'good' : gaps <= 2 ? 'warn' : 'bad'}`;
}

function saveEmployee(empId) {
    const name = document.getElementById('f-emp-name').value.trim();
    const role = document.getElementById('f-emp-role').value;
    const fte = parseFloat(document.getElementById('f-emp-fte').value);
    const color = document.getElementById('f-emp-color').value;

    if (!name) { toast('Vul een naam in!', 'error'); return; }
    if (isNaN(fte) || fte < 0.1 || fte > 1.0) { toast('FTE moet 0.1 - 1.0 zijn!', 'error'); return; }

    if (empId) {
        const emp = state.employees.find(e => e.id === empId);
        emp.name = name; emp.role = role; emp.fte = fte; emp.color = color;
        adjustAllocations(empId, fte);
    } else {
        state.employees.push({ id: state.nextEmpId++, name, role, fte, color });

    closeSheet();
    saveState();
    renderAll();
    toast(empId ? 'Medewerker bijgewerkt' : 'Medewerker toegevoegd!', 'success');

    if (!confirm(`"${emp.name}" verwijderen?`)) return;
    state.employees = state.employees.filter(e => e.id !== empId);
    state.allocations = state.allocations.filter(a => a.empId !== empId);
    closeSheet();
    saveState();
    renderAll();
    toast('Verwijderd', 'success');
}

// -- Pick employee to add to dept --
function openPickEmployee(deptId) {
    const dept = state.departments.find(d => d.id === deptId);
    const existing = state.allocations.filter(a => a.deptId === deptId).map(a => a.empId);

    if (state.employees.length === 0) {
        toast('Maak eerst medewerkers aan!', 'warning');
        return;
    }

    let html = `<h2>&#x1F464; Kies medewerker voor ${dept.name}</h2>`;

    state.employees.forEach(emp => {
        const alreadyHere = existing.includes(emp.id);
        const allocated = getAllocatedFTE(emp.id);
        const remaining = Math.round((emp.fte - allocated) * 10) / 10;
        const disabled = alreadyHere || remaining <= 0;

        html += `<div class="pick-item ${disabled ? 'disabled' : ''}" onclick="${disabled ? '' : `pickEmployee(${emp.id}, ${deptId})`}">
            <div class="poppetje-small">${poppetjeSVG(emp.color, 32)}</div>
            <div class="pick-item-info">
                <div class="pick-item-name">${emp.name}</div>
                <div class="pick-item-meta">${roleLabel(emp.role)} &bull; ${remaining > 0 ? remaining + ' FTE vrij' : alreadyHere ? 'Al toegewezen' : 'Geen FTE vrij'}</div>
            </div>
        </div>`;
    });

    openSheet(html);
}

function pickEmployee(empId, deptId) {
    closeSheet();
    // Open FTE picker
    setTimeout(() => openFTEPicker(empId, deptId), 350);
}

// -- FTE Picker --
function openFTEPicker(empId, deptId, existingAlloc) {
    const emp = state.employees.find(e => e.id === empId);
    const dept = state.departments.find(d => d.id === deptId);
    const otherAlloc = state.allocations
        .filter(a => a.empId === empId && a.deptId !== deptId)
        .reduce((s, a) => s + a.fte, 0);
    const maxFte = Math.round((emp.fte - otherAlloc) * 10) / 10;
    const currentFte = existingAlloc ? existingAlloc.fte : Math.min(maxFte, 0.5);

    openSheet(`
        <h2 style="text-align:center;">${emp.name}</h2>
        <p style="text-align:center;color:#999;margin-bottom:8px;">${roleLabel(emp.role)} &#x2192; ${dept.name}</p>
        <div style="text-align:center;margin:12px 0;">${poppetjeSVG(emp.color, 64)}</div>
        <p style="text-align:center;font-size:0.85em;color:#999;">Hoeveel FTE op deze afdeling?<br/>Max beschikbaar: ${maxFte}</p>
        <div class="fte-stepper">
            <button class="fte-stepper-btn" onclick="stepFTE(-0.1)">−</button>
            <div class="fte-stepper-value" id="fte-pick-val">${currentFte.toFixed(1)}</div>
            <button class="fte-stepper-btn" onclick="stepFTE(0.1)">+</button>
        </div>
        <input type="hidden" id="fte-pick-emp" value="${empId}">
        <input type="hidden" id="fte-pick-dept" value="${deptId}">
        <input type="hidden" id="fte-pick-max" value="${maxFte}">
        <div class="btn-row">
            <button class="btn btn-outline" onclick="closeSheet()">Annuleren</button>
            ${existingAlloc ? `<button class="btn btn-danger" style="flex:0.6" onclick="removeAlloc(${empId},${deptId})">&#x1F5D1;</button>` : ''}
            <button class="btn btn-success" onclick="confirmFTE()">Bevestigen</button>
        </div>
    `);
}

function stepFTE(delta) {
    const el = document.getElementById('fte-pick-val');
    const max = parseFloat(document.getElementById('fte-pick-max').value);
    let val = parseFloat(el.textContent) + delta;
    val = Math.round(val * 10) / 10;
    val = Math.max(0.1, Math.min(max, val));
    el.textContent = val.toFixed(1);
}

function confirmFTE() {
    const empId = parseInt(document.getElementById('fte-pick-emp').value);
    const deptId = parseInt(document.getElementById('fte-pick-dept').value);
    const fte = parseFloat(document.getElementById('fte-pick-val').textContent);

    const existing = state.allocations.find(a => a.empId === empId && a.deptId === deptId);
    if (existing) {
        existing.fte = fte;
    } else {
        state.allocations.push({ empId, deptId, fte });
    }

    closeSheet();
    saveState();
    renderAll();

    const emp = state.employees.find(e => e.id === empId);
    const dept = state.departments.find(d => d.id === deptId);
    toast(`${emp.name} → ${dept.name} (${fte} FTE)`, 'success');
}

function removeAlloc(empId, deptId) {
    state.allocations = state.allocations.filter(a => !(a.empId === empId && a.deptId === deptId));
    closeSheet();
    saveState();
    renderAll();
    toast('Toewijzing verwijderd', 'success');
}

// -- Person on dept (edit allocation) --
function openPersonOnDept(empId, deptId) {
    const alloc = state.allocations.find(a => a.empId === empId && a.deptId === deptId);
    if (alloc) {
        openFTEPicker(empId, deptId, alloc);
    }
}

// -- Add dept from canvas fab --
function openAddDeptToCanvas() {
    if (state.departments.length === 0) {
        openDeptSheet();
        return;
    }
    // Just open new dept sheet since all depts show on canvas in mobile
    openDeptSheet();
}

// ===== HELPERS =====
function getAllocatedFTE(empId) {
    return state.allocations.filter(a => a.empId === empId).reduce((s, a) => s + a.fte, 0);
}

function getDeptFilled(deptId) {
    return state.allocations.filter(a => a.deptId === deptId).reduce((s, a) => s + a.fte, 0);
}

function adjustAllocations(empId, maxFte) {
    const allocs = state.allocations.filter(a => a.empId === empId);
    const total = allocs.reduce((s, a) => s + a.fte, 0);
    if (total <= maxFte) return;
    const ratio = maxFte / total;
    allocs.forEach(a => { a.fte = Math.round(a.fte * ratio * 10) / 10; });
}

function roleLabel(r) {
    return { developer:'Developer', designer:'Designer', manager:'Manager', sales:'Sales',
             marketing:'Marketing', hr:'HR', finance:'Finance', support:'Support',
             operations:'Operations', overig:'Overig' }[r] || r;
}

function priorityLabel(p) {
    return { high:'Hoog', medium:'Midden', low:'Laag' }[p] || p;
}

// ===== TOAST =====
function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type}`;
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== STORAGE =====
function saveState() {
    try { localStorage.setItem('wiezittwaar', JSON.stringify(state)); } catch(e) {}
}

function loadState() {
    try {
        const s = localStorage.getItem('wiezittwaar');
        if (s) state = JSON.parse(s);
    } catch(e) {}
}

// ===== SETTINGS ACTIONS =====
function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'wie-zit-waar-export.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Geëxporteerd!', 'success');
}

function importData() { document.getElementById('import-file').click(); }

function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const d = JSON.parse(e.target.result);
            if (d.employees && d.departments) {
                state = d;
                saveState();
                renderAll();
                toast('Geïmporteerd!', 'success');
            } else {
                toast('Ongeldig bestand!', 'error');
            }
        } catch(err) { toast('Fout bij importeren', 'error'); }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function resetAll() {
    if (!confirm('Alle data wissen? Dit kan niet ongedaan worden!')) return;
    state = { employees: [], departments: [], allocations: [], nextEmpId: 1, nextDeptId: 1 };
    saveState();
    renderAll();
    toast('Alles gewist', 'success');
}

function loadDemo() {
    state.employees = [
        { id: 1, name: 'Lisa de Vries', role: 'developer', fte: 1.0, color: '#3498db' },
        { id: 2, name: 'Mark Jansen', role: 'developer', fte: 0.8, color: '#2ecc71' },
        { id: 3, name: 'Sophie Bakker', role: 'designer', fte: 1.0, color: '#9b59b6' },
        { id: 4, name: 'Tom Visser', role: 'manager', fte: 1.0, color: '#e67e22' },
        { id: 5, name: 'Anna Smit', role: 'sales', fte: 0.6, color: '#e74c3c' },
        { id: 6, name: 'Pieter Mulder', role: 'support', fte: 1.0, color: '#1abc9c' },
    ];
    state.departments = [
        { id: 1, name: 'Engineering', fteNeeded: 3, priority: 'high', minFte: 2, maxFte: 5, roles: ['developer','designer'], color: '#3498db' },
        { id: 2, name: 'Sales & Marketing', fteNeeded: 2, priority: 'medium', minFte: 1, maxFte: 3, roles: ['sales','marketing'], color: '#e74c3c' },
        { id: 3, name: 'Klantenservice', fteNeeded: 1.5, priority: 'medium', minFte: 1, maxFte: 2, roles: ['support'], color: '#2ecc71' },
        { id: 4, name: 'Management', fteNeeded: 1, priority: 'high', minFte: 1, maxFte: 2, roles: ['manager'], color: '#f39c12' },
    ];
    state.allocations = [];
    state.deptOrder = [1, 2, 3, 4];
    state.nextEmpId = 7;
    state.nextDeptId = 5;
    saveState();
    renderAll();
    switchView('canvas');
    toast('Demo data geladen!', 'success');
}

// ===== INIT =====
loadState();
renderAll();

// Load demo if fresh
if (state.employees.length === 0 && state.departments.length === 0) {
    loadDemo();
}
</script>
</body>
</html>
