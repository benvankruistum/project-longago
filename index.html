<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workforce Allocator - Wie Zit Waar?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f0e6d3;
            --sidebar-bg: #2c3e50;
            --card-bg: #fff;
            --accent: #e74c3c;
            --accent2: #3498db;
            --accent3: #2ecc71;
            --accent4: #f39c12;
            --text: #2c3e50;
            --text-light: #ecf0f1;
            --shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--sidebar-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 100;
            box-shadow: 4px 0 20px rgba(0,0,0,0.3);
        }

        .sidebar-header {
            padding: 20px;
            background: #1a252f;
            text-align: center;
        }

        .sidebar-header h1 {
            font-size: 1.3em;
            margin-bottom: 4px;
        }

        .sidebar-header .subtitle {
            font-size: 0.8em;
            opacity: 0.7;
        }

        .score-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 20px;
            background: #1e2d3d;
            border-bottom: 2px solid #34495e;
        }

        .score-item {
            text-align: center;
        }

        .score-item .label {
            font-size: 0.65em;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .score-item .value {
            font-size: 1.4em;
            font-weight: bold;
        }

        .score-item .value.good { color: var(--accent3); }
        .score-item .value.warn { color: var(--accent4); }
        .score-item .value.bad { color: var(--accent); }

        .sidebar-tabs {
            display: flex;
            border-bottom: 2px solid #34495e;
        }

        .sidebar-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            transition: all 0.2s;
        }

        .sidebar-tab.active {
            color: white;
            background: #34495e;
            border-bottom: 3px solid var(--accent2);
        }

        .sidebar-tab:hover { color: white; }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .sidebar-content::-webkit-scrollbar { width: 6px; }
        .sidebar-content::-webkit-scrollbar-thumb { background: #4a6278; border-radius: 3px; }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .section-title h3 {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-add {
            background: var(--accent2);
            color: white;
        }

        .btn-add:hover { background: #2980b9; transform: scale(1.05); }

        .btn-danger {
            background: var(--accent);
            color: white;
        }

        .btn-danger:hover { background: #c0392b; }

        .btn-save {
            background: var(--accent3);
            color: white;
        }

        .btn-save:hover { background: #27ae60; }

        /* Employee cards in sidebar */
        .employee-card {
            background: #34495e;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: grab;
            transition: all 0.2s;
            border-left: 4px solid var(--accent2);
            position: relative;
        }

        .employee-card:hover {
            background: #3d566e;
            transform: translateX(4px);
        }

        .employee-card.dragging {
            opacity: 0.5;
        }

        .employee-card .emp-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .emp-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .emp-info { flex: 1; }

        .emp-name {
            font-weight: 600;
            font-size: 0.95em;
        }

        .emp-role {
            font-size: 0.75em;
            opacity: 0.6;
        }

        .emp-fte {
            font-size: 0.75em;
            margin-top: 4px;
        }

        .fte-bar {
            height: 6px;
            background: #1a252f;
            border-radius: 3px;
            margin-top: 3px;
            overflow: hidden;
        }

        .fte-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .emp-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
        }

        .emp-action-btn {
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .employee-card:hover .emp-action-btn { opacity: 1; }

        .emp-action-btn.edit { background: var(--accent4); color: white; }
        .emp-action-btn.delete { background: var(--accent); color: white; }

        /* Department templates in sidebar */
        .dept-template {
            background: #34495e;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: grab;
            transition: all 0.2s;
            border-left: 4px solid var(--accent4);
        }

        .dept-template:hover {
            background: #3d566e;
            transform: translateX(4px);
        }

        .dept-template .dept-name {
            font-weight: 600;
            font-size: 0.95em;
        }

        .dept-template .dept-meta {
            font-size: 0.75em;
            opacity: 0.6;
            margin-top: 2px;
        }

        /* ===== CANVAS ===== */
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
            position: relative;
            background:
                radial-gradient(circle at 20% 30%, #d5e8d4 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, #dae8fc 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, #fff2cc 0%, transparent 40%),
                var(--bg);
            background-size: cover;
        }

        /* Grid pattern overlay */
        #canvas::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(circle, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        /* SVG for connection lines */
        #connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Department on canvas */
        .dept-on-canvas {
            position: absolute;
            min-width: 200px;
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            cursor: move;
            z-index: 10;
            transition: box-shadow 0.2s;
            overflow: hidden;
        }

        .dept-on-canvas:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .dept-on-canvas.drop-target {
            box-shadow: 0 0 0 4px var(--accent2), 0 8px 30px rgba(52,152,219,0.4);
        }

        .dept-roof {
            height: 8px;
            border-radius: 16px 16px 0 0;
        }

        .dept-body {
            padding: 14px;
        }

        .dept-title {
            font-weight: 700;
            font-size: 1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dept-title .priority-badge {
            font-size: 0.65em;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .priority-high { background: #fde8e8; color: var(--accent); }
        .priority-medium { background: #fef3cd; color: #856404; }
        .priority-low { background: #d4edda; color: #155724; }

        .dept-stats {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            font-size: 0.75em;
        }

        .dept-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dept-fte-bar {
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            position: relative;
        }

        .dept-fte-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.4s ease;
        }

        .dept-fte-label {
            font-size: 0.7em;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            color: #666;
        }

        .dept-roles-needed {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .role-tag {
            font-size: 0.65em;
            padding: 2px 8px;
            border-radius: 10px;
            background: #eef2f7;
            color: #555;
        }

        .role-tag.filled { background: #d4edda; color: #155724; }
        .role-tag.unfilled { background: #fde8e8; color: #721c24; }

        /* Poppetjes on departments */
        .dept-employees {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 40px;
            padding: 6px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #dee2e6;
        }

        .dept-employees.drag-over {
            border-color: var(--accent2);
            background: #ebf5fb;
        }

        .mini-poppetje {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .mini-poppetje:hover {
            transform: scale(1.15);
        }

        .mini-poppetje .fte-label {
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 1px 4px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .dept-canvas-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .dept-on-canvas:hover .dept-canvas-actions { opacity: 1; }

        .dept-canvas-btn {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.1);
            color: #555;
            transition: all 0.2s;
        }

        .dept-canvas-btn:hover {
            background: rgba(0,0,0,0.2);
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 30px;
            min-width: 420px;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal h2 {
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95em;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent2);
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group { flex: 1; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        .btn-cancel {
            background: #eee;
            color: #555;
        }

        .btn-cancel:hover { background: #ddd; }

        /* ===== TOOLTIPS & MISC ===== */
        .canvas-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(0,0,0,0.2);
            font-size: 1.2em;
            pointer-events: none;
        }

        .canvas-hint .hint-icon {
            font-size: 4em;
            display: block;
            margin-bottom: 10px;
        }

        /* Allocation popup */
        .allocation-popup {
            display: none;
            position: fixed;
            background: white;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 500;
            min-width: 250px;
        }

        .allocation-popup.show { display: block; }

        .allocation-popup h4 {
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .alloc-slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .alloc-slider-row input[type="range"] {
            flex: 1;
        }

        .alloc-slider-row .alloc-value {
            font-weight: bold;
            min-width: 40px;
            text-align: right;
        }

        .alloc-slider-row .alloc-dept {
            font-size: 0.85em;
            min-width: 80px;
        }

        /* Connection line tooltip */
        .connection-label {
            position: absolute;
            background: rgba(255,255,255,0.95);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.7em;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            pointer-events: none;
            z-index: 6;
        }

        /* Canvas toolbar */
        .canvas-toolbar {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 50;
        }

        .toolbar-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            background: white;
            color: var(--text);
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        /* Fun empty states */
        .empty-state {
            text-align: center;
            padding: 20px;
            opacity: 0.5;
        }

        .empty-state .empty-icon {
            font-size: 2.5em;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.85em;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
            z-index: 2000;
            animation: notifIn 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        @keyframes notifIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .notification.success { background: var(--accent3); }
        .notification.warning { background: var(--accent4); }
        .notification.error { background: var(--accent); }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-header">
        <h1>&#x1F3E2; Workforce Allocator</h1>
        <div class="subtitle">Wie Zit Waar? &mdash; Sleep &amp; Verdeel</div>
    </div>

    <div class="score-bar">
        <div class="score-item">
            <div class="label">Score</div>
            <div class="value good" id="total-score">0</div>
        </div>
        <div class="score-item">
            <div class="label">Bezetting</div>
            <div class="value" id="fill-rate">0%</div>
        </div>
        <div class="score-item">
            <div class="label">Gaten</div>
            <div class="value bad" id="gaps-count">0</div>
        </div>
        <div class="score-item">
            <div class="label">FTE vrij</div>
            <div class="value" id="free-fte">0</div>
        </div>
    </div>

    <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="employees" onclick="switchTab('employees')">&#x1F464; Medewerkers</button>
        <button class="sidebar-tab" data-tab="departments" onclick="switchTab('departments')">&#x1F3E0; Afdelingen</button>
    </div>

    <div class="sidebar-content" id="sidebar-content">
        <!-- Dynamic content -->
    </div>
</div>

<!-- CANVAS -->
<div class="canvas-container">
    <div id="canvas">
        <svg id="connections-svg"></svg>
        <div class="canvas-hint" id="canvas-hint">
            <span class="hint-icon">&#x1F3AF;</span>
            Sleep afdelingen vanuit het menu hierheen!<br/>
            Daarna sleep je medewerkers op de afdelingen.
        </div>
    </div>

    <div class="canvas-toolbar">
        <button class="toolbar-btn" onclick="autoArrange()">&#x2728; Auto-indelen</button>
        <button class="toolbar-btn" onclick="clearCanvas()">&#x1F5D1; Wis canvas</button>
        <button class="toolbar-btn" onclick="exportData()">&#x1F4BE; Exporteer</button>
        <button class="toolbar-btn" onclick="importData()">&#x1F4C2; Importeer</button>
    </div>
</div>

<!-- EMPLOYEE MODAL -->
<div class="modal-overlay" id="employee-modal">
    <div class="modal">
        <h2 id="emp-modal-title">&#x1F464; Nieuwe Medewerker</h2>
        <div class="form-group">
            <label>Naam</label>
            <input type="text" id="emp-name" placeholder="Jan Jansen">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Rol</label>
                <select id="emp-role">
                    <option value="developer">Developer</option>
                    <option value="designer">Designer</option>
                    <option value="manager">Manager</option>
                    <option value="sales">Sales</option>
                    <option value="marketing">Marketing</option>
                    <option value="hr">HR</option>
                    <option value="finance">Finance</option>
                    <option value="support">Support</option>
                    <option value="operations">Operations</option>
                    <option value="overig">Overig</option>
                </select>
            </div>
            <div class="form-group">
                <label>FTE (0.1 - 1.0)</label>
                <input type="number" id="emp-fte" min="0.1" max="1.0" step="0.1" value="1.0">
            </div>
        </div>
        <div class="form-group">
            <label>Kleur (voor poppetje)</label>
            <input type="color" id="emp-color" value="#3498db" style="height:40px;">
        </div>
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeModal('employee-modal')">Annuleren</button>
            <button class="btn btn-save" id="emp-save-btn" onclick="saveEmployee()">Opslaan</button>
        </div>
    </div>
</div>

<!-- DEPARTMENT MODAL -->
<div class="modal-overlay" id="dept-modal">
    <div class="modal">
        <h2 id="dept-modal-title">&#x1F3E0; Nieuwe Afdeling</h2>
        <div class="form-group">
            <label>Naam</label>
            <input type="text" id="dept-name" placeholder="Engineering">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Benodigde FTE</label>
                <input type="number" id="dept-fte-needed" min="0.5" max="50" step="0.5" value="3.0">
            </div>
            <div class="form-group">
                <label>Prioriteit</label>
                <select id="dept-priority">
                    <option value="high">Hoog</option>
                    <option value="medium" selected>Midden</option>
                    <option value="low">Laag</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Min. bezetting (FTE)</label>
                <input type="number" id="dept-min" min="0" max="50" step="0.5" value="1.0">
            </div>
            <div class="form-group">
                <label>Max. bezetting (FTE)</label>
                <input type="number" id="dept-max" min="0.5" max="50" step="0.5" value="5.0">
            </div>
        </div>
        <div class="form-group">
            <label>Benodigde rollen (komma-gescheiden)</label>
            <input type="text" id="dept-roles" placeholder="developer, designer, manager">
        </div>
        <div class="form-group">
            <label>Kleur</label>
            <input type="color" id="dept-color" value="#e74c3c" style="height:40px;">
        </div>
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeModal('dept-modal')">Annuleren</button>
            <button class="btn btn-save" id="dept-save-btn" onclick="saveDepartment()">Opslaan</button>
        </div>
    </div>
</div>

<!-- ALLOCATION POPUP -->
<div class="allocation-popup" id="allocation-popup">
    <h4 id="alloc-title">FTE Verdeling</h4>
    <div id="alloc-sliders"></div>
    <div style="text-align:right; margin-top:10px;">
        <button class="btn btn-cancel" onclick="closeAllocPopup()" style="font-size:0.75em;">Sluiten</button>
    </div>
</div>

<!-- IMPORT FILE INPUT (hidden) -->
<input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
// ===== STATE =====
let state = {
    employees: [],
    departments: [],
    placements: [],     // { deptId, x, y } - departments on canvas
    allocations: [],    // { empId, deptId, fte } - employee-to-dept assignments
    nextEmpId: 1,
    nextDeptId: 1
};

let activeTab = 'employees';
let editingEmpId = null;
let editingDeptId = null;
let dragState = null;

// ===== POPPETJE SVG GENERATOR =====
function poppetjeSVG(color, size = 40, expression = 'happy') {
    const s = size;
    const headR = s * 0.25;
    const cx = s / 2;

    const faces = {
        happy: `<circle cx="${cx - headR*0.25}" cy="${s*0.22}" r="${headR*0.08}" fill="#333"/>
                <circle cx="${cx + headR*0.25}" cy="${s*0.22}" r="${headR*0.08}" fill="#333"/>
                <path d="M${cx - headR*0.2} ${s*0.3} Q${cx} ${s*0.38} ${cx + headR*0.2} ${s*0.3}" stroke="#333" stroke-width="1.2" fill="none" stroke-linecap="round"/>`,
        neutral: `<circle cx="${cx - headR*0.25}" cy="${s*0.22}" r="${headR*0.08}" fill="#333"/>
                  <circle cx="${cx + headR*0.25}" cy="${s*0.22}" r="${headR*0.08}" fill="#333"/>
                  <line x1="${cx - headR*0.15}" y1="${s*0.31}" x2="${cx + headR*0.15}" y2="${s*0.31}" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>`,
        busy: `<line x1="${cx - headR*0.3}" y1="${s*0.2}" x2="${cx - headR*0.12}" y2="${s*0.24}" stroke="#333" stroke-width="1" stroke-linecap="round"/>
               <line x1="${cx + headR*0.3}" y1="${s*0.2}" x2="${cx + headR*0.12}" y2="${s*0.24}" stroke="#333" stroke-width="1" stroke-linecap="round"/>
               <circle cx="${cx - headR*0.25}" cy="${s*0.22}" r="${headR*0.06}" fill="#333"/>
               <circle cx="${cx + headR*0.25}" cy="${s*0.22}" r="${headR*0.06}" fill="#333"/>
               <ellipse cx="${cx}" cy="${s*0.32}" rx="${headR*0.12}" ry="${headR*0.08}" fill="#333"/>`
    };

    return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg">
        <!-- Head -->
        <circle cx="${cx}" cy="${s*0.24}" r="${headR}" fill="${color}" stroke="${darken(color, 30)}" stroke-width="1.5"/>
        <!-- Body -->
        <ellipse cx="${cx}" cy="${s*0.58}" rx="${s*0.2}" ry="${s*0.18}" fill="${color}" stroke="${darken(color, 30)}" stroke-width="1.5"/>
        <!-- Legs -->
        <line x1="${cx - s*0.08}" y1="${s*0.72}" x2="${cx - s*0.12}" y2="${s*0.92}" stroke="${darken(color, 30)}" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="${cx + s*0.08}" y1="${s*0.72}" x2="${cx + s*0.12}" y2="${s*0.92}" stroke="${darken(color, 30)}" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Arms -->
        <line x1="${cx - s*0.18}" y1="${s*0.52}" x2="${cx - s*0.28}" y2="${s*0.65}" stroke="${darken(color, 30)}" stroke-width="2" stroke-linecap="round"/>
        <line x1="${cx + s*0.18}" y1="${s*0.52}" x2="${cx + s*0.28}" y2="${s*0.65}" stroke="${darken(color, 30)}" stroke-width="2" stroke-linecap="round"/>
        <!-- Face -->
        ${faces[expression] || faces.happy}
        <!-- Shoes -->
        <ellipse cx="${cx - s*0.13}" cy="${s*0.94}" rx="${s*0.05}" ry="${s*0.03}" fill="${darken(color, 50)}"/>
        <ellipse cx="${cx + s*0.13}" cy="${s*0.94}" rx="${s*0.05}" ry="${s*0.03}" fill="${darken(color, 50)}"/>
    </svg>`;
}

function darken(hex, amount) {
    hex = hex.replace('#', '');
    let r = Math.max(0, parseInt(hex.substr(0,2), 16) - amount);
    let g = Math.max(0, parseInt(hex.substr(2,2), 16) - amount);
    let b = Math.max(0, parseInt(hex.substr(4,2), 16) - amount);
    return `rgb(${r},${g},${b})`;
}

// ===== TABS =====
function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.sidebar-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
    });
    renderSidebar();
}

// ===== SIDEBAR RENDERING =====
function renderSidebar() {
    const container = document.getElementById('sidebar-content');

    if (activeTab === 'employees') {
        renderEmployeesSidebar(container);
    } else {
        renderDepartmentsSidebar(container);
    }
}

function renderEmployeesSidebar(container) {
    let html = `<div class="section-title">
        <h3>Medewerkers (${state.employees.length})</h3>
        <button class="btn btn-add" onclick="openEmployeeModal()">+ Nieuw</button>
    </div>`;

    if (state.employees.length === 0) {
        html += `<div class="empty-state">
            <div class="empty-icon">&#x1F9D1;&#x200D;&#x1F4BC;</div>
            <p>Nog geen medewerkers.<br/>Klik "+ Nieuw" om er een aan te maken!</p>
        </div>`;
    } else {
        state.employees.forEach(emp => {
            const allocated = getAllocatedFTE(emp.id);
            const remaining = Math.max(0, emp.fte - allocated);
            const pct = emp.fte > 0 ? (allocated / emp.fte) * 100 : 0;
            const expression = pct >= 100 ? 'busy' : pct > 0 ? 'neutral' : 'happy';

            const barColor = pct >= 100 ? 'var(--accent)' : pct > 50 ? 'var(--accent4)' : 'var(--accent3)';

            html += `<div class="employee-card" draggable="true"
                          ondragstart="dragEmployee(event, ${emp.id})"
                          ondragend="dragEnd(event)">
                <div class="emp-actions">
                    <button class="emp-action-btn edit" onclick="editEmployee(${emp.id})" title="Bewerken">&#x270F;</button>
                    <button class="emp-action-btn delete" onclick="deleteEmployee(${emp.id})" title="Verwijderen">&#x2716;</button>
                </div>
                <div class="emp-header">
                    <div class="emp-avatar">${poppetjeSVG(emp.color, 40, expression)}</div>
                    <div class="emp-info">
                        <div class="emp-name">${emp.name}</div>
                        <div class="emp-role">${roleLabel(emp.role)}</div>
                    </div>
                </div>
                <div class="emp-fte">
                    ${allocated.toFixed(1)} / ${emp.fte.toFixed(1)} FTE toegewezen
                    ${remaining > 0 ? `<span style="color:var(--accent3)"> (${remaining.toFixed(1)} vrij)</span>` : ''}
                </div>
                <div class="fte-bar">
                    <div class="fte-bar-fill" style="width:${Math.min(pct,100)}%; background:${barColor}"></div>
                </div>
            </div>`;
        });
    }

    container.innerHTML = html;
}

function renderDepartmentsSidebar(container) {
    let html = `<div class="section-title">
        <h3>Afdelingen (${state.departments.length})</h3>
        <button class="btn btn-add" onclick="openDeptModal()">+ Nieuw</button>
    </div>`;

    const unplaced = state.departments.filter(d => !state.placements.find(p => p.deptId === d.id));
    const placed = state.departments.filter(d => state.placements.find(p => p.deptId === d.id));

    if (state.departments.length === 0) {
        html += `<div class="empty-state">
            <div class="empty-icon">&#x1F3E2;</div>
            <p>Nog geen afdelingen.<br/>Klik "+ Nieuw" om er een aan te maken!</p>
        </div>`;
    } else {
        if (unplaced.length > 0) {
            html += `<h4 style="font-size:0.8em;opacity:0.5;margin:10px 0 6px;">&#x1F4CB; Nog niet geplaatst &mdash; sleep naar canvas</h4>`;
            unplaced.forEach(dept => {
                html += deptTemplateHTML(dept);
            });
        }
        if (placed.length > 0) {
            html += `<h4 style="font-size:0.8em;opacity:0.5;margin:10px 0 6px;">&#x2705; Op het canvas</h4>`;
            placed.forEach(dept => {
                const filled = getDeptFilledFTE(dept.id);
                html += `<div class="dept-template" style="border-left-color:${dept.color}; opacity:0.7; cursor:default;">
                    <div class="dept-name">${dept.name}</div>
                    <div class="dept-meta">${filled.toFixed(1)} / ${dept.fteNeeded.toFixed(1)} FTE | Prioriteit: ${priorityLabel(dept.priority)}</div>
                    <div style="margin-top:6px; display:flex; gap:4px;">
                        <button class="btn btn-add" style="font-size:0.7em; padding:3px 10px;" onclick="editDepartment(${dept.id})">&#x270F; Bewerk</button>
                        <button class="btn btn-danger" style="font-size:0.7em; padding:3px 10px;" onclick="deleteDepartment(${dept.id})">&#x2716; Verwijder</button>
                    </div>
                </div>`;
            });
        }
    }

    container.innerHTML = html;
}

function deptTemplateHTML(dept) {
    return `<div class="dept-template" draggable="true"
                 ondragstart="dragDepartment(event, ${dept.id})"
                 ondragend="dragEnd(event)"
                 style="border-left-color:${dept.color}">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="dept-name">${dept.name}</div>
            <div style="display:flex; gap:4px;">
                <button class="emp-action-btn edit" style="opacity:1;" onclick="event.stopPropagation(); editDepartment(${dept.id})">&#x270F;</button>
                <button class="emp-action-btn delete" style="opacity:1;" onclick="event.stopPropagation(); deleteDepartment(${dept.id})">&#x2716;</button>
            </div>
        </div>
        <div class="dept-meta">
            ${dept.fteNeeded} FTE nodig | Prioriteit: ${priorityLabel(dept.priority)}
            ${dept.roles.length > 0 ? ' | Rollen: ' + dept.roles.join(', ') : ''}
        </div>
    </div>`;
}

// ===== CANVAS RENDERING =====
function renderCanvas() {
    const canvas = document.getElementById('canvas');
    const hint = document.getElementById('canvas-hint');

    // Remove old departments from canvas
    canvas.querySelectorAll('.dept-on-canvas').forEach(el => el.remove());

    if (state.placements.length === 0) {
        hint.style.display = 'block';
    } else {
        hint.style.display = 'none';
    }

    state.placements.forEach(placement => {
        const dept = state.departments.find(d => d.id === placement.deptId);
        if (!dept) return;

        const el = createDeptCanvasElement(dept, placement);
        canvas.appendChild(el);
    });

    renderConnections();
    updateScores();
}

function createDeptCanvasElement(dept, placement) {
    const div = document.createElement('div');
    div.className = 'dept-on-canvas';
    div.id = `dept-canvas-${dept.id}`;
    div.style.left = placement.x + 'px';
    div.style.top = placement.y + 'px';

    const filledFTE = getDeptFilledFTE(dept.id);
    const pct = dept.fteNeeded > 0 ? (filledFTE / dept.fteNeeded) * 100 : 0;
    const barColor = pct >= 100 ? '#2ecc71' : pct >= 50 ? '#f39c12' : '#e74c3c';
    const allocations = state.allocations.filter(a => a.deptId === dept.id);

    let empHTML = '';
    allocations.forEach(alloc => {
        const emp = state.employees.find(e => e.id === alloc.empId);
        if (!emp) return;
        const totalAllocated = getAllocatedFTE(emp.id);
        const expression = totalAllocated >= emp.fte ? 'busy' : 'neutral';
        empHTML += `<div class="mini-poppetje" onclick="openAllocPopup(${emp.id}, event)" title="${emp.name}: ${alloc.fte} FTE">
            ${poppetjeSVG(emp.color, 34, expression)}
            <span class="fte-label">${alloc.fte}</span>
        </div>`;
    });

    let rolesHTML = '';
    if (dept.roles.length > 0) {
        dept.roles.forEach(role => {
            const hasRole = allocations.some(a => {
                const emp = state.employees.find(e => e.id === a.empId);
                return emp && emp.role === role;
            });
            rolesHTML += `<span class="role-tag ${hasRole ? 'filled' : 'unfilled'}">${roleLabel(role)}</span>`;
        });
    }

    div.innerHTML = `
        <div class="dept-roof" style="background:${dept.color}"></div>
        <div class="dept-canvas-actions">
            <button class="dept-canvas-btn" onclick="editDepartment(${dept.id})" title="Bewerken">&#x270F;</button>
            <button class="dept-canvas-btn" onclick="removeDeptFromCanvas(${dept.id})" title="Van canvas halen">&#x2716;</button>
        </div>
        <div class="dept-body">
            <div class="dept-title">
                ${dept.name}
                <span class="priority-badge priority-${dept.priority}">${priorityLabel(dept.priority)}</span>
            </div>
            <div class="dept-stats">
                <div class="dept-stat">&#x1F465; ${allocations.length} personen</div>
                <div class="dept-stat">&#x1F4CA; ${filledFTE.toFixed(1)}/${dept.fteNeeded.toFixed(1)} FTE</div>
            </div>
            <div class="dept-fte-bar">
                <div class="dept-fte-fill" style="width:${Math.min(pct,100)}%; background:${barColor}"></div>
            </div>
            <div class="dept-fte-label">
                <span>Min: ${dept.minFte}</span>
                <span>${pct.toFixed(0)}%</span>
                <span>Max: ${dept.maxFte}</span>
            </div>
            ${rolesHTML ? `<div class="dept-roles-needed">${rolesHTML}</div>` : ''}
            <div class="dept-employees" id="dept-drop-${dept.id}"
                 ondragover="dragOverDept(event, ${dept.id})"
                 ondragleave="dragLeaveDept(event, ${dept.id})"
                 ondrop="dropOnDept(event, ${dept.id})">
                ${empHTML || '<span style="font-size:0.75em;opacity:0.4;">Sleep medewerkers hierheen</span>'}
            </div>
        </div>
    `;

    // Make department draggable on canvas
    makeDraggable(div, placement);

    return div;
}

// ===== CONNECTIONS (CURVED LINES) =====
function renderConnections() {
    const svg = document.getElementById('connections-svg');
    svg.innerHTML = '';

    // Remove old labels
    document.querySelectorAll('.connection-label').forEach(el => el.remove());

    // Group allocations by employee
    const empAllocations = {};
    state.allocations.forEach(alloc => {
        if (!empAllocations[alloc.empId]) empAllocations[alloc.empId] = [];
        empAllocations[alloc.empId].push(alloc);
    });

    Object.entries(empAllocations).forEach(([empId, allocs]) => {
        if (allocs.length <= 1) return; // No lines for single assignment

        const emp = state.employees.find(e => e.id === parseInt(empId));
        if (!emp) return;

        // Find primary dept (largest FTE)
        const primary = allocs.reduce((a, b) => a.fte >= b.fte ? a : b);

        allocs.forEach(alloc => {
            if (alloc.deptId === primary.deptId) return;

            const fromEl = document.getElementById(`dept-canvas-${primary.deptId}`);
            const toEl = document.getElementById(`dept-canvas-${alloc.deptId}`);
            if (!fromEl || !toEl) return;

            const fromRect = fromEl.getBoundingClientRect();
            const toRect = toEl.getBoundingClientRect();
            const canvasRect = document.getElementById('canvas').getBoundingClientRect();

            const x1 = fromRect.left + fromRect.width / 2 - canvasRect.left;
            const y1 = fromRect.top + fromRect.height / 2 - canvasRect.top;
            const x2 = toRect.left + toRect.width / 2 - canvasRect.left;
            const y2 = toRect.top + toRect.height / 2 - canvasRect.top;

            // Curved line
            const midX = (x1 + x2) / 2;
            const midY = (y1 + y2) / 2 - 50;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M${x1},${y1} Q${midX},${midY} ${x2},${y2}`);
            path.setAttribute('stroke', emp.color);
            path.setAttribute('stroke-width', '2.5');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-dasharray', '8,4');
            path.setAttribute('opacity', '0.7');
            svg.appendChild(path);

            // Arrow at end
            const angle = Math.atan2(y2 - midY, x2 - midX);
            const arrowSize = 8;
            const arrowPath = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            const ax = x2 - arrowSize * Math.cos(angle - 0.4);
            const ay = y2 - arrowSize * Math.sin(angle - 0.4);
            const bx = x2 - arrowSize * Math.cos(angle + 0.4);
            const by = y2 - arrowSize * Math.sin(angle + 0.4);
            arrowPath.setAttribute('points', `${x2},${y2} ${ax},${ay} ${bx},${by}`);
            arrowPath.setAttribute('fill', emp.color);
            arrowPath.setAttribute('opacity', '0.7');
            svg.appendChild(arrowPath);

            // Label
            const label = document.createElement('div');
            label.className = 'connection-label';
            label.style.left = (midX - 20) + 'px';
            label.style.top = (midY - 10) + 'px';
            label.style.color = emp.color;
            label.textContent = `${emp.name}: ${alloc.fte} FTE`;
            document.getElementById('canvas').appendChild(label);
        });
    });
}

// ===== DRAG & DROP =====
function dragEmployee(event, empId) {
    event.dataTransfer.setData('type', 'employee');
    event.dataTransfer.setData('empId', empId);
    event.target.closest('.employee-card').classList.add('dragging');
}

function dragDepartment(event, deptId) {
    event.dataTransfer.setData('type', 'department');
    event.dataTransfer.setData('deptId', deptId);
}

function dragEnd(event) {
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function dragOverDept(event, deptId) {
    event.preventDefault();
    const dropZone = document.getElementById(`dept-drop-${deptId}`);
    if (dropZone) dropZone.classList.add('drag-over');
}

function dragLeaveDept(event, deptId) {
    const dropZone = document.getElementById(`dept-drop-${deptId}`);
    if (dropZone) dropZone.classList.remove('drag-over');
}

function dropOnDept(event, deptId) {
    event.preventDefault();
    event.stopPropagation();

    const type = event.dataTransfer.getData('type');
    if (type !== 'employee') return;

    const empId = parseInt(event.dataTransfer.getData('empId'));
    const emp = state.employees.find(e => e.id === empId);
    if (!emp) return;

    // Check if already allocated to this dept
    const existing = state.allocations.find(a => a.empId === empId && a.deptId === deptId);
    if (existing) {
        notify('Deze medewerker zit al op deze afdeling!', 'warning');
        return;
    }

    // Calculate remaining FTE
    const allocated = getAllocatedFTE(empId);
    const remaining = Math.round((emp.fte - allocated) * 10) / 10;

    if (remaining <= 0) {
        notify(`${emp.name} heeft geen FTE meer beschikbaar!`, 'error');
        return;
    }

    // Default allocation: whatever remains, max 0.5 for secondary
    const isFirstAllocation = allocated === 0;
    const defaultFte = isFirstAllocation ? remaining : Math.min(remaining, 0.5);

    state.allocations.push({ empId, deptId, fte: defaultFte });
    saveState();
    renderAll();
    notify(`${emp.name} toegewezen aan ${state.departments.find(d => d.id === deptId).name} (${defaultFte} FTE)`, 'success');
}

// Canvas drop for departments
const canvas = document.getElementById('canvas');
canvas.addEventListener('dragover', (e) => {
    e.preventDefault();
});

canvas.addEventListener('drop', (e) => {
    e.preventDefault();
    const type = e.dataTransfer.getData('type');

    if (type === 'department') {
        const deptId = parseInt(e.dataTransfer.getData('deptId'));
        const canvasRect = canvas.getBoundingClientRect();
        const x = e.clientX - canvasRect.left - 100;
        const y = e.clientY - canvasRect.top - 50;

        // Check if already placed
        const existingIdx = state.placements.findIndex(p => p.deptId === deptId);
        if (existingIdx >= 0) {
            state.placements[existingIdx].x = x;
            state.placements[existingIdx].y = y;
        } else {
            state.placements.push({ deptId, x: Math.max(10, x), y: Math.max(10, y) });
        }

        saveState();
        renderAll();
    }
});

// Make department draggable on canvas
function makeDraggable(el, placement) {
    let isDragging = false;
    let startX, startY, origX, origY;

    el.addEventListener('mousedown', (e) => {
        if (e.target.closest('button') || e.target.closest('.dept-employees') || e.target.closest('.mini-poppetje')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        origX = placement.x;
        origY = placement.y;
        el.style.zIndex = 100;
        e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        placement.x = Math.max(0, origX + dx);
        placement.y = Math.max(0, origY + dy);
        el.style.left = placement.x + 'px';
        el.style.top = placement.y + 'px';
        renderConnections();
    });

    document.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            el.style.zIndex = 10;
            saveState();
        }
    });
}

// ===== ALLOCATION POPUP =====
function openAllocPopup(empId, event) {
    event.stopPropagation();
    const emp = state.employees.find(e => e.id === empId);
    if (!emp) return;

    const popup = document.getElementById('allocation-popup');
    const title = document.getElementById('alloc-title');
    const sliders = document.getElementById('alloc-sliders');

    title.innerHTML = `${poppetjeSVG(emp.color, 24, 'neutral')} ${emp.name} (${emp.fte} FTE)`;

    const empAllocs = state.allocations.filter(a => a.empId === empId);
    let html = '';

    empAllocs.forEach(alloc => {
        const dept = state.departments.find(d => d.id === alloc.deptId);
        if (!dept) return;

        html += `<div class="alloc-slider-row">
            <span class="alloc-dept" style="color:${dept.color}">${dept.name}</span>
            <input type="range" min="0" max="${emp.fte * 10}" step="1" value="${alloc.fte * 10}"
                   oninput="updateAllocation(${empId}, ${alloc.deptId}, this.value / 10, this)"
                   style="accent-color:${dept.color}">
            <span class="alloc-value" id="alloc-val-${empId}-${alloc.deptId}">${alloc.fte.toFixed(1)}</span>
            <button class="emp-action-btn delete" style="opacity:1; width:18px; height:18px; font-size:9px;"
                    onclick="removeAllocation(${empId}, ${alloc.deptId})">&#x2716;</button>
        </div>`;
    });

    const totalAlloc = empAllocs.reduce((sum, a) => sum + a.fte, 0);
    html += `<div style="font-size:0.8em; margin-top:8px; padding-top:8px; border-top:1px solid #eee;">
        Toegewezen: <strong>${totalAlloc.toFixed(1)}</strong> / ${emp.fte.toFixed(1)} FTE
        ${totalAlloc < emp.fte ? `<span style="color:var(--accent3)"> (${(emp.fte - totalAlloc).toFixed(1)} vrij)</span>` : ''}
    </div>`;

    sliders.innerHTML = html;

    // Position popup
    popup.style.left = event.clientX + 'px';
    popup.style.top = event.clientY + 'px';
    popup.classList.add('show');

    // Close on outside click
    setTimeout(() => {
        document.addEventListener('click', closeAllocOnOutside);
    }, 100);
}

function closeAllocOnOutside(e) {
    const popup = document.getElementById('allocation-popup');
    if (!popup.contains(e.target)) {
        closeAllocPopup();
    }
}

function closeAllocPopup() {
    document.getElementById('allocation-popup').classList.remove('show');
    document.removeEventListener('click', closeAllocOnOutside);
}

function updateAllocation(empId, deptId, newFte, slider) {
    const emp = state.employees.find(e => e.id === empId);
    if (!emp) return;

    // Calculate total allocated to other depts
    const otherAlloc = state.allocations
        .filter(a => a.empId === empId && a.deptId !== deptId)
        .reduce((sum, a) => sum + a.fte, 0);

    const maxAllowable = Math.round((emp.fte - otherAlloc) * 10) / 10;
    newFte = Math.min(newFte, maxAllowable);
    newFte = Math.round(newFte * 10) / 10;

    if (slider) slider.value = newFte * 10;

    const alloc = state.allocations.find(a => a.empId === empId && a.deptId === deptId);
    if (alloc) {
        if (newFte <= 0) {
            removeAllocation(empId, deptId);
            return;
        }
        alloc.fte = newFte;
    }

    document.getElementById(`alloc-val-${empId}-${deptId}`).textContent = newFte.toFixed(1);
    saveState();
    renderAll();

    // Re-open popup to refresh totals
    // Not ideal but keeps it simple
}

function removeAllocation(empId, deptId) {
    state.allocations = state.allocations.filter(a => !(a.empId === empId && a.deptId === deptId));
    closeAllocPopup();
    saveState();
    renderAll();
}

// ===== SCORING =====
function updateScores() {
    let totalScore = 0;
    let totalNeeded = 0;
    let totalFilled = 0;
    let gaps = 0;

    const priorityMultiplier = { high: 3, medium: 2, low: 1 };

    state.placements.forEach(placement => {
        const dept = state.departments.find(d => d.id === placement.deptId);
        if (!dept) return;

        const filled = getDeptFilledFTE(dept.id);
        totalNeeded += dept.fteNeeded;
        totalFilled += Math.min(filled, dept.fteNeeded);

        const fillPct = dept.fteNeeded > 0 ? filled / dept.fteNeeded : 1;
        const mult = priorityMultiplier[dept.priority] || 1;

        // Score: 100 points per dept * fill% * priority multiplier
        totalScore += Math.round(fillPct * 100 * mult);

        // Penalty for underfilling below minimum
        if (filled < dept.minFte) {
            const underPct = (dept.minFte - filled) / dept.minFte;
            totalScore -= Math.round(underPct * 50 * mult);
            gaps++;
        }

        // Small penalty for overfilling
        if (filled > dept.maxFte) {
            totalScore -= Math.round((filled - dept.maxFte) * 10);
        }

        // Gap if below needed
        if (filled < dept.fteNeeded) gaps++;
    });

    totalScore = Math.max(0, totalScore);

    const fillRate = totalNeeded > 0 ? Math.round((totalFilled / totalNeeded) * 100) : 0;
    const freeFTE = state.employees.reduce((sum, e) => sum + e.fte, 0) -
                    state.allocations.reduce((sum, a) => sum + a.fte, 0);

    document.getElementById('total-score').textContent = totalScore;
    document.getElementById('total-score').className = `value ${totalScore > 300 ? 'good' : totalScore > 100 ? 'warn' : 'bad'}`;

    document.getElementById('fill-rate').textContent = fillRate + '%';
    document.getElementById('fill-rate').className = `value ${fillRate >= 80 ? 'good' : fillRate >= 50 ? 'warn' : 'bad'}`;

    document.getElementById('gaps-count').textContent = gaps;
    document.getElementById('gaps-count').className = `value ${gaps === 0 ? 'good' : gaps <= 2 ? 'warn' : 'bad'}`;

    document.getElementById('free-fte').textContent = freeFTE.toFixed(1);
    document.getElementById('free-fte').className = `value ${freeFTE > 0 ? 'warn' : 'good'}`;
}

// ===== HELPERS =====
function getAllocatedFTE(empId) {
    return state.allocations
        .filter(a => a.empId === empId)
        .reduce((sum, a) => sum + a.fte, 0);
}

function getDeptFilledFTE(deptId) {
    return state.allocations
        .filter(a => a.deptId === deptId)
        .reduce((sum, a) => sum + a.fte, 0);
}

function adjustAllocations(empId, maxFte) {
    const allocs = state.allocations.filter(a => a.empId === empId);
    const total = allocs.reduce((sum, a) => sum + a.fte, 0);
    if (total <= maxFte) return;

    // Proportionally reduce
    const ratio = maxFte / total;
    allocs.forEach(alloc => {
        alloc.fte = Math.round(alloc.fte * ratio * 10) / 10;
    });
}

}

// ===== TOOLBAR ACTIONS =====
function autoArrange() {
    const placed = state.placements;
    if (placed.length === 0) return;

    const canvasRect = document.getElementById('canvas').getBoundingClientRect();
    const cols = Math.ceil(Math.sqrt(placed.length));
    const spacing = 30;
    const cardW = 240;
    const cardH = 260;

    const startX = 40;
    const startY = 40;

    placed.forEach((p, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        p.x = startX + col * (cardW + spacing);
        p.y = startY + row * (cardH + spacing);
    });

    saveState();
    renderAll();
    notify('Afdelingen automatisch ingedeeld!', 'success');
}

function clearCanvas() {
    if (!confirm('Weet je zeker dat je het canvas wilt legen? Afdelingen worden terug naar de lijst gezet.')) return;
    state.placements = [];
    state.allocations = [];
    saveState();
    renderAll();
}

function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'workforce-allocator-export.json';
    a.click();
    URL.revokeObjectURL(url);
    notify('Data geëxporteerd!', 'success');
}

function importData() {
    document.getElementById('import-file').click();
}

function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const imported = JSON.parse(e.target.result);
            if (imported.employees && imported.departments) {
                state = imported;
                saveState();
                renderAll();
                notify('Data geïmporteerd!', 'success');
            } else {
                notify('Ongeldig bestand!', 'error');
            }
        } catch (err) {
            notify('Fout bij importeren: ' + err.message, 'error');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

// ===== NOTIFICATIONS =====
function notify(msg, type = 'success') {
    const existing = document.querySelector('.notification');
    if (existing) existing.remove();

    const el = document.createElement('div');
    el.className = `notification ${type}`;
    el.textContent = msg;
    document.body.appendChild(el);

    setTimeout(() => el.remove(), 3000);
}

// ===== LOCAL STORAGE =====
function saveState() {
    localStorage.setItem('workforce-allocator', JSON.stringify(state));
}

function loadState() {
    const saved = localStorage.getItem('workforce-allocator');
    if (saved) {
        try {
            state = JSON.parse(saved);
        } catch(e) {
            console.error('Failed to load state:', e);
        }
    }
}
